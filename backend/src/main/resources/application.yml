server:
  port: 8080

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

spring:
  application:
    name: workout-plan-ai

# AI provider configuration — config-driven so the implementation can be swapped
# without touching business logic. See PlanGenerationProvider.
# groq is the default: Gemini's free tier excludes EU/EEA/UK/Switzerland, Groq
# has no such restriction.
ai:
  provider: groq # options: gemini, groq
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
  groq:
    api-key: ${GROQ_API_KEY:}
    model: llama-3.3-70b-versatile
    base-url: https://api.groq.com/openai/v1
